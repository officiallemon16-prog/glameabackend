name: glamea
description: "Glamea - world-class beauty discovery, trust, booking and marketplace experience."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3

  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Media
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10
  image_picker: ^1.1.2

  # Push notifications
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5

  # Connectivity
  connectivity_plus: ^6.0.3

  # Location & maps
  geolocator: ^12.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.0

  # Deep links & launcher
  app_links: ^6.1.4
  url_launcher: ^6.2.6

  # UX
  shimmer: ^3.0.0
  intl: ^0.20.3
  confetti: ^0.7.0

  # Social auth
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0

  # Misc
  uuid: ^4.4.0
  equatable: ^2.0.5
  share_plus: ^12.0.2
  web_socket_channel: ^3.0.3
  emoji_picker_flutter: ^4.5.3
  flutter_webrtc: ^1.6.0
  webview_flutter: ^4.14.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  connectivity_plus_platform_interface: ^2.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
          weight: 100
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
          weight: 900
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
