services:
  - type: web
    name: glamea-backend
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: HTTP_ADDR
        value: ":$PORT"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL
        value: 720h
      - key: OTP_TTL
        value: 5m
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_UPLOAD_FOLDER
        value: glamea
      - key: SEERBIT_SECRET_KEY
        sync: false
      - key: SEERBIT_PUBLIC_KEY
        sync: false
      - key: SEERBIT_BASE_URL
        value: https://seerbitapi.com/api/v2
      - key: APP_URL
        value: https://glameabackend.onrender.com
      - key: PLATFORM_FEE_PERCENT
        value: "8.0"
      - key: DEFAULT_CURRENCY
        value: NGN
      - key: FCM_PROJECT_ID
        sync: false
      - key: FCM_SERVICE_ACCOUNT_FILE
        value: ""
      - key: BOOKING_SLOT_LOCK_TTL
        value: 10m
      - key: IDEMPOTENCY_KEY_TTL
        value: 24h
      - key: PAYOUT_HOLDING_PERIOD
        value: 168h
      - key: EMAIL_FROM
        value: "Glamea <no-reply@nder.beauty>"
